[project]
name = "atlas-map"
version = "0.2.0"
description = "What runs where, and why: one checked card per thing, built on the canon's terminal design system"
requires-python = ">=3.11"
dependencies = ["canon-lib[tui]", "markdown-it-py>=3"]

[tool.uv.sources]
# the terminal design system is canon-lib's (ui_style, widgets, picker), pinned to a release; move the
# tag to take a change to the look
canon-lib = { git = "https://github.com/cwkoenigs/canon", tag = "canon-lib-v0.2.0", subdirectory = "lib" }

[project.scripts]
atlas = "atlas_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_cli"]

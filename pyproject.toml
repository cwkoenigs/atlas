[project]
name = "atlas-map"
version = "0.2.0"
description = "What runs where, and why: one checked card per thing, built on ds-cli-design"
requires-python = ">=3.10"
dependencies = ["ds-cli-design"]

[tool.uv.sources]
ds-cli-design = { git = "https://github.com/cwkoenigs/ds-cli-design" }

[project.scripts]
atlas = "atlas_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_cli"]

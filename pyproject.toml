[project]
name = "atlas-map"
version = "0.2.0"
description = "What runs where, and why: one checked card per thing, built on ds-cli-design"
requires-python = ">=3.10"
dependencies = ["ds-cli-design", "markdown-it-py>=3"]

[tool.uv.sources]
# the terminal design system, pinned to a release; move the tag to take a change to the look
ds-cli-design = { git = "https://github.com/cwkoenigs/ds-cli-design", tag = "v1.1.0" }

[project.scripts]
atlas = "atlas_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_cli"]

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<!-- @ds-favicon start -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%20viewBox=%220%200%2040%2040%22%3E%20%3Ctitle%3EData%20Science%3C/title%3E%20%3Crect%20width=%2240%22%20height=%2240%22%20fill=%22%2300aba5%22/%3E%20%3Ctext%20x=%2220%22%20y=%2227%22%20text-anchor=%22middle%22%20font-family=%22Georgia,serif%22%20font-size=%2222%22%20fill=%22%23021832%22%3Eds%3C/text%3E%20%3C/svg%3E">
<!-- @ds-favicon end -->
<script nonce="{{nonce}}">
(() => {
  let t = null;
  try { t = localStorage.getItem("atlas-wiki-theme"); } catch (_) {}
  if (location.hash === "#dark" || location.hash === "#light") {
    t = location.hash.slice(1);
    try { localStorage.setItem("atlas-wiki-theme", t); } catch (_) {}
  }
  document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
})();
</script>

/* Dashboard components for the Data Science design system. Hand-written, and the only hand-written
   CSS in the package: every color, radius and shadow here is a var(--token) from theme/tokens.css
   (scripts/check_theme.py refuses a literal). Lengths the system does not tokenize (page width,
   gutters, card padding) are plain values. The build inlines tokens.css + this file into every
   template between the @ds-theme markers, so a page stays a single file with no build step.

   The look: a navy masthead and hero in both themes, teal rules as the only accent, big Georgia
   figures, monospace for labels, ids and commands. Square corners, no gradients, no shadows, no
   motion; hover changes color only. */

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ifm-background-color); }
body {
  margin: 0;
  background: var(--ifm-background-color);
  color: var(--ifm-font-color-base);
  font-family: var(--font-base);
  font-size: var(--type-body-size);
  font-weight: var(--type-body-weight);
  line-height: var(--type-body-leading);
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 32px; }

/* Masthead: the navbar's navy in both themes. With a .hero after it, the two read as one navy
   block and the teal rule moves under the hero. */
.masthead {
  background: var(--ifm-navbar-background-color);
  color: var(--ifm-navbar-link-color);
  border-bottom: var(--rule-width) solid var(--ifm-color-primary);
  box-shadow: var(--ifm-navbar-shadow);
}
.masthead:has(+ .hero) { border-bottom: 0; }
.masthead .wrap {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--space-brand-gap);
  min-height: var(--ifm-navbar-height);
  padding-top: 12px; padding-bottom: 12px;
}
.masthead .mark { display: block; width: var(--navbar-logo-size); height: var(--navbar-logo-size); }
.masthead h1, .masthead .brand {
  margin: 0;
  font-family: var(--font-heading);
  font-size: var(--type-navbar-title-size);
  font-weight: var(--type-navbar-title-weight);
  letter-spacing: var(--type-navbar-title-tracking);
  line-height: 1.2;
  color: var(--ifm-navbar-link-color);
  text-decoration: none;
}
.masthead .crumb { font-family: var(--font-monospace); font-size: var(--type-toc-size); color: var(--ifm-navbar-search-input-placeholder-color); }
.masthead .refreshed {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 0 auto;
  font-family: var(--font-monospace); font-size: var(--type-toc-size);
  color: var(--ifm-navbar-link-color);
}
/* A square teal pip before the refresh time. It decorates; the words say Live or Manual. */
.masthead .refreshed::before { content: ""; width: 8px; height: 8px; background: var(--ifm-navbar-search-input-placeholder-color); }
.masthead .refreshed[data-live]::before { background: var(--ifm-color-primary); }
/* Light/dark switch: a square outlined button on the navy; hover changes color only. */
.theme-toggle {
  padding: 4px 10px;
  font-family: var(--font-monospace); font-size: var(--type-toc-size);
  color: var(--ifm-navbar-link-color);
  background: transparent;
  border: 1px solid var(--ifm-navbar-search-input-placeholder-color);
  border-radius: var(--ifm-global-radius);
  cursor: pointer;
}
.theme-toggle:hover { color: var(--ifm-navbar-link-hover-color); border-color: var(--ifm-navbar-link-hover-color); }
.masthead a { color: var(--ifm-navbar-link-color); }
.masthead a:hover, .masthead a.brand:hover { color: var(--ifm-navbar-link-hover-color); }
.masthead :focus-visible, .hero :focus-visible { outline: var(--focus-ring-width) solid var(--ifm-navbar-link-hover-color); outline-offset: var(--focus-ring-offset); }

/* Hero: the page title at full h1 size on navy, a lead, and an optional row of figures. */
.hero {
  background: var(--ifm-navbar-background-color);
  color: var(--ifm-navbar-link-color);
  border-bottom: calc(var(--rule-width) * 2) solid var(--ifm-color-primary);
}
.hero .wrap { padding-top: 40px; padding-bottom: 40px; }
.hero .eyebrow {
  margin: 0 0 10px;
  font-family: var(--font-monospace); font-size: var(--type-toc-size);
  color: var(--ifm-navbar-link-hover-color);
}
.hero h1 {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(var(--type-h1-compact-size), var(--h1-fluid-size), var(--type-h1-size));
  font-weight: var(--type-h1-weight); letter-spacing: var(--type-h1-tracking);
  line-height: 1.05;
}
.hero .lead { margin: 14px 0 0; max-width: 46em; color: var(--ifm-navbar-search-input-placeholder-color); }
.hero .lead a { color: var(--ifm-navbar-link-hover-color); }
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  margin: 32px 0 0; padding: 0;
  border-top: 1px solid var(--ifm-color-primary-darkest);
}
.stats > div { padding: 18px 20px 0 0; }
.stats > div + div { padding-left: 20px; border-left: 1px solid var(--ifm-color-primary-darkest); }
.stats dt { font-family: var(--font-monospace); font-size: var(--type-toc-size); color: var(--ifm-navbar-search-input-placeholder-color); }
.stats dd {
  margin: 4px 0 0;
  font-family: var(--font-heading);
  font-size: var(--type-h1-compact-size); font-weight: var(--type-h1-weight); letter-spacing: var(--type-h1-tracking);
  line-height: 1.1;
  color: var(--ifm-navbar-link-color);
}
.stats dd small { display: block; margin-top: 4px; font-family: var(--font-base); font-size: var(--type-toc-size); letter-spacing: 0; color: var(--ifm-navbar-search-input-placeholder-color); }

/* Prose */
main.wrap { padding-top: 8px; padding-bottom: 72px; }
h2 {
  display: flex; align-items: baseline; gap: 14px;
  margin: 56px 0 18px;
  font-family: var(--font-heading);
  font-size: var(--type-h2-size); font-weight: var(--type-h2-weight); letter-spacing: var(--type-h2-tracking);
  line-height: 1.25;
}
/* Section index in mono before the heading, a hairline running out after it. */
h2 .idx { font-family: var(--font-monospace); font-size: var(--type-toc-size); font-weight: 600; letter-spacing: 0; color: var(--ifm-link-color); }
h2::after { content: ""; flex: 1; align-self: center; border-top: 1px solid var(--ifm-color-emphasis-200); }
h3 {
  margin: 1.5rem 0 0.5rem;
  font-family: var(--font-heading);
  font-size: var(--type-h3-size); font-weight: var(--type-h3-weight); letter-spacing: var(--type-h3-tracking);
  line-height: 1.3;
}
p { margin: 0 0 1rem; }
.lead { color: var(--ifm-color-content-secondary); font-size: var(--type-lead-size); }
a { color: var(--ifm-link-color); text-underline-offset: var(--underline-offset-prose); }
a:hover { color: var(--ifm-link-hover-color); }
:focus-visible { outline: var(--focus-ring-width) solid var(--ifm-link-color); outline-offset: var(--focus-ring-offset); }
code {
  font-family: var(--font-monospace); font-size: var(--type-code-size);
  padding: 0.1rem 0.3rem;
  background: var(--ifm-code-background);
  border-radius: var(--ifm-code-border-radius);
}

/* Command blocks: a navy terminal in both themes, a teal rule on the left, comments stepped back. */
pre {
  margin: 0 0 1rem; padding: 16px 18px; overflow-x: auto;
  font-family: var(--font-monospace); font-size: var(--type-code-size); line-height: 1.65;
  background: var(--ifm-navbar-background-color);
  color: var(--ifm-navbar-link-color);
  border-left: calc(var(--rule-width) * 2) solid var(--ifm-color-primary);
  border-radius: var(--ifm-code-border-radius);
}
pre code { padding: 0; background: none; color: inherit; }
pre .c { color: var(--ifm-navbar-search-input-placeholder-color); }

/* Most urgent first: the banner sits above everything and names what needs action.
   Navy in both themes, a thick teal rule on the left, the label in mono. */
.banner {
  display: flex; gap: 16px; align-items: baseline;
  margin: 28px 0 0; padding: 16px 20px;
  background: var(--ifm-navbar-background-color);
  color: var(--ifm-navbar-link-color);
  border-left: calc(var(--rule-width) * 3) solid var(--ifm-color-primary);
}
.banner[hidden] { display: none; }
.banner::before {
  content: attr(data-label);
  flex: none;
  font-family: var(--font-monospace); font-size: var(--type-toc-size); font-weight: 600;
  color: var(--ifm-navbar-link-hover-color);
}
.banner:not([data-label])::before { content: "Action"; }
.banner a, .banner code { color: var(--ifm-navbar-link-hover-color); }
.banner code { background: var(--ifm-navbar-search-input-background-color); }
.banner + .banner { margin-top: 8px; }

/* At a glance: figure cards, each with a teal rule on top. */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 0 0 1rem; }
.card {
  padding: 20px 22px;
  background: var(--ifm-background-surface-color);
  border: 1px solid var(--ifm-color-emphasis-200);
  border-radius: var(--ifm-card-border-radius);
}
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
main > .card + .card { margin-top: 16px; }
.grid > .card { border-top: var(--rule-width) solid var(--ifm-color-primary); }
.card .label { font-family: var(--font-monospace); font-size: var(--type-toc-size); color: var(--ifm-color-content-secondary); }
.card .value {
  margin: 6px 0 2px;
  font-family: var(--font-heading);
  font-size: var(--type-h1-compact-size); font-weight: var(--type-h1-weight); letter-spacing: var(--type-h1-tracking);
  line-height: 1.1;
}
.card .sub { font-size: var(--type-toc-size); color: var(--ifm-color-content-secondary); }
.card .sub.status { color: var(--ifm-link-color); }

/* A meter: a teal fill on a hairline track. The number beside it carries the meaning. */
.meter { height: 6px; margin: 12px 0 8px; background: var(--ifm-color-emphasis-200); }
.meter > span { display: block; height: 100%; width: 0; background: var(--ifm-color-primary); }
.meter[hidden] { display: none; }

/* Detail tables: a navy header row, hairlines between rows only; scroll sideways when narrow. */
.table-scroll { overflow-x: auto; margin: 0 0 1rem; border: 1px solid var(--ifm-color-emphasis-200); }
table { width: 100%; border-collapse: collapse; background: var(--ifm-background-surface-color); font-size: var(--type-table-size); }
th, td { text-align: left; padding: 0.7rem 1rem; border-bottom: 1px solid var(--ifm-color-emphasis-200); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th {
  font-family: var(--font-monospace); font-size: var(--type-toc-size); font-weight: 600;
  background: var(--ifm-navbar-background-color); color: var(--ifm-navbar-link-color);
  border-bottom: var(--rule-width) solid var(--ifm-color-primary);
}
tbody tr:hover td, table tr:hover td { background: var(--ifm-menu-color-background-active); }
td code { white-space: nowrap; }

/* Status is words. .status gives emphasis in the text-safe accent; .muted steps back.
   .pill sets the words in a square chip: teal for attention, .quiet for things on hold. */
.status { color: var(--ifm-link-color); font-weight: 600; }
.muted { color: var(--ifm-color-content-secondary); }
.pill {
  display: inline-block; padding: 2px 8px;
  font-size: var(--type-toc-size); font-weight: 600; line-height: 1.5;
  background: var(--ifm-menu-color-background-active); color: var(--ifm-menu-color-active);
  border-left: var(--rule-width) solid var(--ifm-color-primary);
  border-radius: var(--ifm-global-radius);
}
.pill.quiet { background: var(--ifm-code-background); color: var(--ifm-color-content-secondary); border-left-color: var(--ifm-color-content-secondary); }

/* A list of files or links with a note each. */
.filelist {
  list-style: none; margin: 0 0 1rem; padding: 0;
  background: var(--ifm-background-surface-color);
  border: 1px solid var(--ifm-color-emphasis-200);
}
.filelist li {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--ifm-color-emphasis-200);
  border-left: var(--rule-width) solid transparent;
}

/* Search results */
.results { list-style: none; margin: 0; padding: 0; }
.page .results li { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--ifm-color-emphasis-200); }
.results .title { font-family: var(--font-heading); font-size: 1.2rem; }
.results p { margin: 4px 0 0; }
.results mark { padding: 0 2px; background: var(--search-local-highlight-color); color: var(--search-local-hit-active-color); }

footer.site { margin-top: 0; }
footer.site .wrap { max-width: none; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
footer.site kbd { font-family: var(--font-monospace); padding: 0 4px; border: 1px solid var(--ifm-footer-color); border-radius: var(--ifm-global-radius); }

/* breakpoint-mobile (996px): the one literal, because a media query cannot read a custom property */
@media (max-width: 996px) {
  .navbar { flex-wrap: wrap; gap: 10px 16px; padding: 10px 16px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .bar-links { gap: 14px; }
  .bar-links a[href="/special/recent"] { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--ifm-toc-border-color); }
  .sidebar-inner { position: static; max-height: none; }
  .sidebar .more { display: none; }
  .page { padding: 24px 16px 48px; }
  .article { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .article > .rail, .article > .prose { grid-column: 1; grid-row: auto; }
  .article > .rail { order: -1; }
  .form-grid, .connections { grid-template-columns: minmax(0, 1fr); }
  .page .rows li, .changes li { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the page</a>
<header class="navbar">
  <a class="brand" href="/" aria-label="Atlas, the main page">
<!-- @ds-mark start -->
<img class="mark" src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%20viewBox=%220%200%2040%2040%22%3E%20%3Ctitle%3EData%20Science%3C/title%3E%20%3Crect%20width=%2240%22%20height=%2240%22%20fill=%22%2300aba5%22/%3E%20%3Ctext%20x=%2220%22%20y=%2227%22%20text-anchor=%22middle%22%20font-family=%22Georgia,serif%22%20font-size=%2222%22%20fill=%22%23021832%22%3Eds%3C/text%3E%20%3C/svg%3E" alt="" width="34" height="34">
<!-- @ds-mark end -->
    <span>Atlas</span>
  </a>
  <form class="search" action="/search" role="search" autocomplete="off">
    <input type="search" name="q" value="{{query}}" placeholder="Search the atlas" aria-label="Search the atlas">
    <input type="hidden" name="go" value="1">
    <div class="suggest" role="listbox" hidden></div>
  </form>
  <nav class="bar-links" aria-label="Wiki">
    {{barlinks}}
    <button class="theme-toggle" type="button">Dark</button>
  </nav>
</header>
<div class="layout">
  <nav class="sidebar" aria-label="Pages"><div class="sidebar-inner">{{sidebar}}</div></nav>
  <main class="page" id="content">
{{main}}
  </main>
</div>
<footer class="site"><div class="wrap">{{footer}}</div></footer>
<script nonce="{{nonce}}">
(() => {
  const root = document.documentElement;

  // Light or dark: light unless you chose dark; the choice is remembered.
  const toggle = document.querySelector(".theme-toggle");
  const label = () => {
    toggle.textContent = root.dataset.theme === "dark" ? "Light" : "Dark";
    toggle.setAttribute("aria-label", "Switch to the " + toggle.textContent.toLowerCase() + " theme");
  };
  toggle.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("atlas-wiki-theme", root.dataset.theme); } catch (_) {}
    label();
  });
  label();

  // Search as you type: pages first, then places, kinds and special pages.
  const input = document.querySelector(".navbar .search input[type=search]");
  const box = document.querySelector(".navbar .suggest");
  let items = [], sel = -1, timer = null, seq = 0;
  const draw = () => {
    box.replaceChildren(...items.map((it, i) => {
      const a = document.createElement("a");
      a.href = it.url;
      a.setAttribute("role", "option");
      a.setAttribute("aria-selected", i === sel ? "true" : "false");
      const t = document.createElement("span"); t.textContent = it.title;
      const s = document.createElement("small"); s.textContent = it.sub;
      a.append(t, s);
      return a;
    }));
    box.hidden = items.length === 0;
  };
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { items = []; draw(); return; }
    const mine = ++seq;
    timer = setTimeout(async () => {
      try {
        const r = await fetch("/api/suggest?q=" + encodeURIComponent(q));
        if (mine !== seq) return;
        items = await r.json(); sel = -1; draw();
      } catch (_) {}
    }, 70);
  });
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") { sel = Math.min(sel + 1, items.length - 1); draw(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp") { sel = Math.max(sel - 1, -1); draw(); ev.preventDefault(); }
    else if (ev.key === "Enter" && sel >= 0) { location.href = items[sel].url; ev.preventDefault(); }
    else if (ev.key === "Escape") { items = []; draw(); input.blur(); }
  });
  document.addEventListener("click", (ev) => {
    if (!box.contains(ev.target) && ev.target !== input) { items = []; draw(); }
  });

  // Keys: / searches, e edits the page you are reading.
  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest("input, textarea, select, [contenteditable]") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "/") { input.focus(); ev.preventDefault(); }
    else if (ev.key === "e") { const a = document.querySelector("a[data-key=edit]"); if (a) location.href = a.href; }
  });

  // Editing: Cmd-S saves; leaving with unsaved changes asks first.
  const form = document.querySelector("form.edit");
  if (form) {
    let dirty = false;
    form.addEventListener("input", () => { dirty = true; });
    form.addEventListener("submit", () => { dirty = false; });
    window.addEventListener("beforeunload", (ev) => { if (dirty) { ev.preventDefault(); ev.returnValue = ""; } });
    document.addEventListener("keydown", (ev) => {
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "s") {
        ev.preventDefault(); dirty = false;
        form.querySelector("button[value=save]").click();
      }
    });
  }

  // History: picking two versions to compare.
  const cmp = document.querySelector("form.compare");
  if (cmp) {
    const sync = () => {
      const a = cmp.querySelector("input[name=a]:checked"), b = cmp.querySelector("input[name=b]:checked");
      cmp.querySelector("button").disabled = !a || !b || a.value === b.value;
    };
    cmp.addEventListener("change", sync); sync();
  }
})();
</script>
</body>
</html>
